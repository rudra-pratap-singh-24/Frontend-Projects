<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Result Calculator</title>
</head>
<body>
    <h1>Student Result Calculator</h1>
    Name:
    <input type="text" id="name">
    <br><br>
    Roll No.:
    <input type="number" id="roll">
    <br><br>
    Marks in English:
    <input type="number" id="english">
    <br><br>
    Marks in Hindi:
    <input type="number" id="hindi">
    <br><br>
    Marks in Maths:
    <input type="number" id="maths">
    <br><br>
    Marks in Science:
    <input type="number" id="science">
    <br><br>
    Marks in Social Science:
    <input type="number" id="socialscience">
    <br><br>
    Marks in Sanskrit:
    <input type="number" id="sanskrit">
    <br><br>
    <button onclick="calculateResult()">Calculate Result</button>
    <h2 id="total"></h2>
    <h2 id="percentage"></h2>
    <h2 id="grade"></h2>
    <h2 id="status"></h2>
    <script>
        function calculateResult() {
            var english = Number(document.getElementById("english").value);
            var hindi = Number(document.getElementById("hindi").value);
            var maths = Number(document.getElementById("maths").value);
            var science = Number(document.getElementById("science").value);
            var socialscience = Number(document.getElementById("socialscience").value);
            var sanskrit = Number(document.getElementById("sanskrit").value);
            var total = english + hindi + maths + science + socialscience + sanskrit;
            var percentage = (total / 600) * 100;
            var grade;
            if (percentage >= 90) {
                grade = "A+";
            }
            else if (percentage >= 80) {
                grade = "A";
            }
            else if (percentage >= 70) {
                grade = "B";
            }
            else if (percentage >= 60) {
                grade = "C";
            }
            else if (percentage >= 50) {
                grade = "D";
            }
            else {
                grade = "F";
            }
            var status;
            if (percentage >= 33) {
                status = "PASS";
            }
            else {
                status = "FAIL";
            }
            document.getElementById("total").innerHTML =
                "Total Marks = " + total + " / 600";

            document.getElementById("percentage").innerHTML =
                "Percentage = " + percentage.toFixed(2) + "%";

            document.getElementById("grade").innerHTML =
                "Grade = " + grade;

            document.getElementById("status").innerHTML =
                "Result = " + status;
        }
    </script>
</body>
</html>
</body>
</html>
